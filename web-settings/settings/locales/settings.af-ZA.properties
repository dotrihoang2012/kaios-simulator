about-your-rights-0 = {{brandShortName}} is gebou op gratis en oopbron sagteware deur ‘n gemeenskap van duisende regoor die wêreld. Daar is ‘n paar dinge wat jy moet weet:
about-your-rights-1 = {{brandShortName}} word aan jou beskikbaar gestel onder die terme van verskeie oopbron lisensies insluitend die Mozilla Openbare Lisensie. ‘n Toestel wat {{brandShortName}} hardloop mag ook eie sagteware van derdepartye bevat. Enie kode wat onder oop lisensies verskaf word gee jou die reg om die bronkode te wysig en jou gewysigde weergawes te versprei solank as wat jy aan hulle terme voldoen.
about-your-rights-2 = Daar word nie enige handelsmerkregte of lisensies tot die handelsmerke van die Mozilla Stigting of enige party aan jou toegeken nie, insluitend sonder om die {{brandShortName}} naam of logo te beperk.
about-your-rights-3 = Sommige eienskappe in {{brandShortName}}, soos die Fout Verslaggewer gee aan jou die opsie om terugvoer aan Mozilla te verskaf. Deur te kies om terugvoer te verskaf gee jy Mozilla toestemming om die terugvoer te gebruik om sy produkte te verbeter, om die terugvoer op sy webwerwe te publiseer en om die terugvoer te versprei.
