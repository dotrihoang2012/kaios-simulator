about-target = Sử dụng dữ liệu của tôi để cải thiện trải nghiệm quảng cáo.
about-your-rights-0 = {{brandShortName}} do cộng đồng gồm hàng nghìn thành viên từ khắp nơi trên thế giới tích hợp trên phần mềm miễn phí và mã nguồn mở. Có một số điều bạn nên biết:
about-your-rights-1 = {{brandShortName}} được cung cấp cho bạn theo các điều khoản của một số giấy phép mã nguồn mở bao gồm Giấy phép Công cộng Mozilla. Một thiết bị đang chạy {{brandShortName}} cũng có thể bao gồm phần mềm độc quyền từ các bên thứ ba. Bất kỳ mã nào được cung cấp theo các giấy phép mở đều cung cấp cho bạn quyền để sửa đổi mã nguồn và phân phối các phiên bản sửa đổi của bạn miễn là bạn tuân thủ các điều khoản của họ.
about-your-rights-2 = Bạn không được cấp bất kỳ quyền lợi hoặc giấy phép nào về thương hiệu cho các thương hiệu của Mozilla Foundation hoặc bất kỳ bên nào, bao gồm nhưng không giới hạn ở tên hoặc logo của {{brandShortName}}.
about-your-rights-3 = Một số tính năng trong {{brandShortName}}, chẳng hạn như Crash Reporter, cung cấp cho bạn tùy chọn để cung cấp thông tin phản hồi cho Mozilla. Bằng cách chọn để gửi thông tin phản hồi, bạn cho phép Mozilla sử dụng thông tin phản hồi để cải thiện sản phẩm của mình, công bố thông tin phản hồi trên các trang web của mình, và phân phối thông tin phản hồi.
