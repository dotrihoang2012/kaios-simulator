aboutKaiosAgree = Tôi muốn trợ giúp bằng cách gửi dữ liệu phân tích.
aboutKaiosP1 = Chào mừng đến với KaiOS.
aboutKaiosP2 = Nhiệm vụ của chúng tôi là mở ra cơ hội cho các cá nhân, gia đình và cộng đồng bằng cách biến sự tiếp cận đến với các sản phẩm và dịch vụ kỹ thuật số tuyệt vời trở thành hiện thực cho tất cả các thành viên của xã hội.
aboutKaiosP3 = Bạn có thể giúp chúng tôi cải thiện sản phẩm và dịch vụ bằng cách tự động gửi dữ liệu phân tích. Xem điều khoản bảo mật của chúng tôi để tìm hiểu cách chúng tôi xử lý dữ liệu trên thiết bị của bạn.
aboutKaiosP4 = Bạn có thể thay đổi các cài đặt này trong Settings (Cài đặt) > Privacy & Security (Quyền riêng tư & Bảo mật) > About KaiOS (Giới thiệu về KaiOS).
