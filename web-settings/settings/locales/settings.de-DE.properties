about-target = Verwenden Sie meine Daten, um meine Werbeerfahrung zu verbessern.
about-your-rights-0 = {{brandShortName}} basiert auf einer kostenlosen, quelloffenen Software, die von einer Gemeinschaft von Tausenden Nutzern auf der ganzen Welt gemeinsam erstellt wurde. Es gibt einige Punkte, die Sie wissen sollten:
about-your-rights-1 = {{brandShortName}} wird Ihnen gemäß verschiedener Open-Source-Lizenzen, einschließlich der Mozilla Public License, zur Verfügung gestellt. Ein Gerät, auf dem {{brandShortName}} ausgeführt wird, kann auch eigene Softwareprodukte von Dritten enthalten. Für jeden Code, der unter offenen Lizenzen bereitgestellt wird, können Sie den Quellcode modifizieren und Ihre modifizierten Versionen weiter verbreiten, solange Sie die entsprechenden Bedingungen einhalten.
about-your-rights-2 = Ihnen werden keine Markenrechte oder Lizenzen auf die Marken der Mozilla Foundation oder eines beliebigen Beteiligten gewährt, einschließlich und ohne Einschränkung der Name oder das Logo von {{brandShortName}}.
about-your-rights-3 = Einige Funktionen unter {{brandShortName}}, darunter der Mozilla-Absturzmelder, bieten Ihnen die Möglichkeit, Feedback an Mozilla zu senden. Indem Sie sich dafür entscheiden, Feedback zu geben, erlauben Sie Mozilla, das Feedback zur Verbesserung seiner Produkte zu nutzen sowie um das Feedback auf ihren Webseiten zu veröffentlichen und weiterzugeben.
