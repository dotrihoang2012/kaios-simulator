about-your-rights-1 = {{brandShortName}} è stato messo a disposizione ai sensi dei termini di svariate licenze open source inclusa la Licenza Pubblica Mozilla. Un dispositivo con {{brandShortName}} può inoltre contenere software proprietario di terzi. Un codice fornito ai sensi di licenze aperte conferisce il diritto di modificare il codice sorgente e distribuire le versioni modificate fintanto che se ne rispettino i termini.
about-your-rights-2 = Non vengono concessi diritti relativi ai marchi di fabbrica né licenze per i marchi di fabbrica della Mozilla Foundation né di terzi, inclusi senza limitazioni il nome o il logo {{brandShortName}}.
about-your-rights-3 = Alcune funzioni in {{brandShortName}}, ad esempio Crash Reporter, consentono l'opzione di fornire feedback a Mozilla. Scegliendo di inviare un feedback, si concede a Mozilla l'autorizzazione per usare il feedback allo scopo di migliorare i suoi prodotti, pubblicare il feedback sui suoi siti Web e procedere alla sua distribuzione.
