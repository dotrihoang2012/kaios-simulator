aboutKaiosP1 = مرحبًا بك في KaiOS.
aboutKaiosP2 = تتمثل مهمتنا في إتاحة الفرص للأفراد وعائلاتهم والمجتمعات من خلال جعل الوصول إلى المنتجات والخدمات الرقمية الرائعة حقيقة واقعة لجميع أفراد المجتمع.
aboutKaiosP3 = يمكنك مساعدتنا في تحسين المنتجات والخدمات عن طريق إرسال بيانات التحليلات تلقائيًا. راجع شروط الخصوصية لمعرفة كيفية تعاملنا مع البيانات المتاحة على أجهزتك.
