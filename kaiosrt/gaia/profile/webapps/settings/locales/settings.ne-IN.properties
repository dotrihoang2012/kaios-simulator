about-your-rights-0 = {{brandShortName}} विश्व भरिका हजारौँ समुदायहरूद्वारा नि:शुल्क निर्मित तथा खुला स्रोत सफ्टवेयर हो। यहाँ तपाईंले थाहा पाउनुपर्ने केही कुराहरू छन्:
about-your-rights-1 = {{brandShortName}} Mozilla Public License सहितका विभिन्न खुला स्रोत अनुमतिपत्रका सर्तहरूका आधारमा तपाईंलाई उपलब्ध गराइन्छ। {{brandShortName}} चलाउने यन्त्रले तेस्रो पक्षहरूको गुण सफ्टवेयर पनि समावेश गर्न सक्छ खुला अनुमतिपत्रहरू अन्तर्गतको कुनै पनि कोडले तपाईंलाई स्रोत कोड परिमार्जन गर्ने तथा तपाईंले तिनका सर्तहरूको पालना गर्नुहुन्छ भने तपाईंका परिमार्जित संस्करणहरूको वितरण गर्ने अधिकार प्रदान गर्छ
about-your-rights-2 = तपाईंलाई बिना सीमितता {{brandShortName}} नाम वा लोगो सहित मोजिल्ला फाउण्डेशन वा कुनै पनि पक्षका व्यापारचिह्नहरूका लागि कुनै पनि व्यापारचिह्न अधिकार वा अनुमतिपत्रहरूको अनुमति दिइँदैन
about-your-rights-3 = {{brandShortName}} मा भएको केही सुविधाहरू, जस्तै Crash Reporter, ले मोजिल्ला लाई प्रतिक्रिया प्रदान गर्ने विकल्प प्रदान गर्छ। प्रतिक्रिया बुझाउने रोजेर, यसका उत्पादनहरूमा सुधार गर्न, यसका वेबसाइटहरूमा प्रतिक्रिया प्रकाशन गर्न र प्रतिक्रिया वितरण गर्न तपाईंले प्रतिक्रियालाई प्रयोग गर्न मोजिल्ला लाई अनुमति दिनुभयो
