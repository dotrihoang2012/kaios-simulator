about-target = Gunakan data saya untuk meningkatkan pengalaman pengiklanan saya.
about-your-rights-0 = {{brandShortName}} dibina menggunakan perisian sumber terbuka yang percuma oleh beribu-ribu ahli komuniti dari seluruh dunia. Terdapat beberapa perkara yang anda perlu ketahui:
about-your-rights-1 = {{brandShortName}} tersedia untuk anda gunakan di bawah terma beberapa lesen sumber terbuka termasuklah Lesen Awam Mozilla. Peranti yang menjalankan {{brandShortName}} juga mungkin mengandungi perisian proprietari tertentu daripada pihak ketiga. Sebarang kod yang disediakan di bawah lesen terbuka memberi anda hak untuk mengubah suai kod sumber dan mengedarkan versi yang anda ubah suai selagi anda mematuhi terma mereka.
about-your-rights-2 = Anda tidak diberi apa-apa hak tanda dagang atau lesen bagi tanda dagang Mozilla Foundation atau mana-mana pihak, termasuklah tanpa had nama atau logo {{brandShortName}}.
about-your-rights-3 = Sesetengah ciri pada {{brandShortName}}, misalnya Pelapor Kerosakan (Crash Reporter), memberi anda pilihan untuk menghantar maklum balas kepada Mozilla. Dengan memilih untuk menyerahkan maklum balas, anda memberikan kebenaran kepada Mozilla untuk menggunakan maklum balas bagi meningkatkan produknya, untuk menyiarkan maklum balas pada laman webnya, dan untuk mengedarkan maklum balas itu.
