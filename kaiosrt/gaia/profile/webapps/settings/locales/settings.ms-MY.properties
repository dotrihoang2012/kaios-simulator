aboutKaiosP1 = Selamat datang ke KaiOS.
aboutKaiosP2 = Misi kita ialah untuk membuka peluang untuk individu, keluarga mereka dan komuniti dengan menjadikan akses kepada produk dan perkhidmatan digital yang hebat suatu realiti untuk semua ahli masyarakat.
aboutKaiosP3 = Anda boleh membantu kami meningkatkan produk dan perkhidmatan dengan menghantar data analitis secara automatik. Lihat terma privasi kami untuk mengetahui cara kami mengendalikan data pada peranti anda.
