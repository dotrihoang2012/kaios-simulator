about-your-rights-0 = உலகம் முழுவதிலிருந்தும் ஆயிரகணக்கான சமூதாயம் மூலம் {{brandShortName}} ஆனது ஓபன் சோர்ஸ் சாப்ட்வேர் மற்றும் இலவசமாக கட்டமைக்கப்பட்டுள்ளது. நீங்கள் தெரிந்துகொள்ள வேண்டிய சில விஷயங்கள்:
about-your-rights-1 = Mozilla பப்ளிக் லைசென்ஸ் உட்பட பல ஓபன் சோர்ஸ் லைசென்ஸ்-களின் விதிகளின் கீழ் {{brandShortName}} செய்யப்பட்டு உங்களுக்கு கிடைக்கிறது. {{brandShortName}} இயங்கும் ஒரு சாதனம் மூன்றாம் தரப்பினர்களிடமிருந்து தனியுரிம சாப்ட்வேர்களை கொண்டிருக்கக்கூடும். ஓபன் லைசென்ஸ்-களின் கீழ் வழங்கப்பட்ட எந்தவொரு கோட்-இம் அவர்களின் விதிமுறைகளுக்கு இணங்கி இருக்கும் வரை நீங்கள் சோர்ஸ் கோட்-ஐ திருத்தவும் மேலும் உங்களின் திருத்தப்பட்ட பதிப்புகளை விநியோகிக்கவும் உங்களுக்கு உரிமை வழங்குகிறது
about-your-rights-2 = உங்களுக்கு {{brandShortName}} பெயர் அல்லது சின்னம்  தவிர்த்து முத்திரை உரிமைகள் அல்லது Mozilla Foundation-இன் முத்திரைகளின் லைசென்ஸ்-கள் அல்லது ஏதேனும் தரப்புக்கு கிடையாது.
about-your-rights-3 = {{brandShortName}}இல் , சிதைவு ரிப்போர்டர் போன்ற சில அம்சங்கள் Mozilla -க்கு கருத்து வழங்குவதற்கு உங்களுக்கு தெரிவை தருகிறது. கருத்துகளை சமர்ப்பிக்க தேர்வு செய்வதன் மூலம், கருத்துகளை பயன்படுத்தி, அதன் பொருட்களை மேம்படுத்துவதற்கும் அதன் வெப்சைட்-களில் கருத்துகளை வெளியிடுவதற்கும், மற்றும் கருத்துகளை விநியோகிப்பதற்கும் நீங்கள் Mozilla -க்கு அனுமதி வழங்குகிறீர்கள்.
