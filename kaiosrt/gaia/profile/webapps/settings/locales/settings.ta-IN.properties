aboutKaiosAgree = அனலிடிக்ஸ் டேட்டாவை அனுப்புவதன் மூலம் நான் உதவ விரும்புகிறேன்.
aboutKaiosP1 = காய் ஒ.எஸ்-க்கு வரவேற்கிறோம்.
aboutKaiosP2 = சமூகத்தின் அனைத்து உறுப்பினர்களுக்கும் சிறந்த டிஜிட்டல் தயாரிப்புகள் மற்றும் சேவைகளை அணுகுவதன் மூலம் தனிநபர்கள், குடும்பங்கள் மற்றும் சமூகங்களுக்கான வாய்ப்புகளை திறப்பதே எங்கள் நோக்கம்.
aboutKaiosP3 = நீங்கள் அனலிடிக்ஸ் டேட்டா-ஐ தானாக அனுப்புவதன் மூலம், எங்கள் தயாரிப்புகள் மற்றும் சேவைகளை மேம்படுத்துவதற்கு உதவ முடியும். உங்கள் சாதனங்களில் டேட்டா-ஐ எப்படி நாங்கள் கையாள்கிறோம் என்பதை அறிய எங்கள் தனியுரிமை விதிகளை பார்க்கவும்.
aboutKaiosP4 = இந்த அமைப்புகளை அமைப்புகள் > தனியுரிமை & பாதுகாப்பு > காய்.ஓ.எஸ் பற்றி என்பதில் மாற்றலாம்.
