licensing-2 = இந்தத் தயாரிப்பில் உள்ள சோர்ஸ் கோட் அனைத்தும் இலவச மற்றும் ஓபன் சோர்ஸ் லைசென்ஸ் கீழ் கிடைக்கின்றன. அவற்றில் பெரும்பாலானவை Mozilla பப்ளிக் லைசென்ஸ் 2.0 (MPL) ஆக கிடைக்கின்றன.
licensing-3 = Mozilla பப்ளிக் லைசென்ஸ் 2.0 MPL இன் கீழ் இல்லாத ரிமைன்டர் சாப்ட்வேர் மற்ற லைசென்ஸ்-கள் பலவற்றில் ஒன்றில் கிடைக்கும். விநியோகத்தில் லைசென்ஸ் டெக்ஸ்ட் மறுபடி தேவை என்பவர்களுக்கு கீழே கொடுக்கப்பட்டுள்ளனர். (நோட்: இந்த தயாரிப்பில் உங்கள் நகலானது இங்கே பட்டியலிடப்பட்டுள்ள லைசென்ஸ்-களில் ஒன்று அல்லது அதற்கு மேற்பட்டவையில் உள்ளடக்கிய கோட்-ஐ கொண்டிருக்கக்கூடாது, நீங்கள் தேர்வு செய்யும் சரியான பொருள் மற்றும் பதிப்பு அடிப்படையை பொறுத்து இருக்கும்.)
