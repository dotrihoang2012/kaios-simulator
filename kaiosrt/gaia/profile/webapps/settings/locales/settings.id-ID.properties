about-your-rights-0 = {{brandShortName}} dibuat pada perangkat lunak bebas dan open source oleh sebuah komunitas dari seluruh dunia. Ada beberapa hal yang perlu ketahui:
about-your-rights-1 = {{brandShortName}} tersedia untuk Anda dengan ketentuan dari beberapa lisensi open source termasuk Mozilla Public License. Perangkat yang menjalankan {{brandShortName}} mungkin juga mengandung perangkat lunak berpemilik dari pihak ketiga. Kode apa pun yang diberikan oleh lisensi open memberikan Anda hak untuk memodifikasi kode source dan menyebarkan versi modifikasi Anda selama Anda memnuhi ketentuan.
about-your-rights-2 = Anda tidak diberikan hak merek dagang atau lisensi apa pun untuk merek dagang Mozilla Foundation atau pihak mana pun, termasuk tanpa terkecuali nama atau logo {{brandShortName}}.
about-your-rights-3 = Beberapa fitur dalam {{brandShortName}}, seperti Crash Reporter, memberikan Anda opsi untuk memberikan umpan balik ke Mozilla. Dengan memilih menyerahkan umpan balik untuk meningkatkan produknya, untuk mengeluarkan umpan balik pada situs webnya, dan untuk menyebarkan umpan balik.
