about-your-rights-0 = {{brandShortName}}, dünyanın dört bir yanından binlerce kişinin oluşturduğu bir topluluk tarafından ücretsiz açık kaynak kodlu yazılım temel alınarak tasarlanmaktadır. Bilmeniz gereken birkaç şey:
about-your-rights-1 = {{brandShortName}}, Mozilla Kamu Lisansı da dahil çeşitli açık kaynak lisansları şartları altında kullanımınıza sunuldu. {{brandShortName}} kullanan bir cihaz üçüncü şahıslara ait yazılımlar içerebilir. Şartlara uyduğunuz sürece, açık lisanslar kapsamında sağlanan herhangi bir kod, kaynak kodunu değiştirme ve değiştirilen sürümleri dağıtma hakkı verir.
about-your-rights-2 = Size Mozilla Kuruluşuna veya herhangi bir tarafa, {{brandShortName}} adı ve logosu dahil, ancak bununla sınırlı olmamak kaydıyla ticari marka hakkı veya ticari marka lisansı verilmez.
about-your-rights-3 = Kilitlenme Bildirisi gibi bazı {{brandShortName}} özellikleri Mozilla'ya geri bildirimde bulunma seçeneği sunar. Geri bildirimde bulunmayı seçtiğinizde, Mozilla'ya geri bildirimi ürünlerini geliştirmek için kullanma, web sitelerinde yayınlama ve dağıtma izni verirsiniz.
