about-your-rights-0 = {{brandShortName}}, पूरे विश्व में हजारों लोगों के समुदाय द्वारा निर्मित निःशुल्क और ओपन सोर्स सॉफ़्टवेयर हैं। कुछ चीजें, जो आपको पता होनी चाहिए:
about-your-rights-1 = {{brandShortName}} आपके लिए Mozilla पब्लिक लाइसेंस सहित कई ओपन सोर्स लाइसेंस की शर्तों के तहत उपलब्ध हैं। {{brandShortName}} वाली डिवाइस में तृतीय पक्ष के स्वामित्व वाले सॉफ़्टवेयर भी हो सकते हैं। ओपन लाइसेंस के तहत प्रदान किया गया कोई कोड आपको सोर्स कोड को संशोधित करने और उनकी शर्तों का पालन करने तक आपको अपने संशोधित संस्करण वितरित करने का अधिकार देता हैं।
about-your-rights-2 = आपको Mozilla Foundation या किसी तृतीय पक्ष, जिसमें {{brandShortName}} का नाम या लोगो शामिल हैं, लेकिन इसी तक सीमित नहीं हैं, के ट्रेडमार्क का कोई ट्रेडमार्क अधिकार या लाइसेंस नहीं दिया गया हैं।
about-your-rights-3 = {{brandShortName}} में कुछ सुविधाएं, जैसे कि क्रैश रिपोर्टर, आपको Mozilla को प्रतिक्रिया प्रदान करने का विकल्प देता हैं। प्रतिक्रिया प्रस्तुत करने का विकल्प चुनकर, आप Mozilla के उत्पाद को बेहतर बनाने के लिए प्रतिक्रिया का उपयोग करने की , वेबसाइट पर प्रतिक्रिया प्रकाशित करने और प्रतिक्रिया वितरित करने की अनुमति देते हैं।
