about-your-rights-0 = {{brandShortName}} دنیا بھر کے ہزاروں لوگوں کی کمیونٹی کے ذریعے مفت اور فعال ماحذ سافٹ وئیر پر بنایا گيا ہے۔ یہ کچھ چیزیں ہیں جو آپ کو پتہ ہونی چاہیے:
about-your-rights-1 = {{brandShortName}} آپ کیلئے کچھ فعال ماحذ لائسنسیز بشمول موزیلا پبلک لائسنس کی شرائط کے تحت مہیا کیا گیا ہے۔ کوئی آلہ جو {{brandShortName}} کو چلارہا ہو اس میں فریق ثالث کی طرف سے ملکیتی سافٹ وئیر شامل ہو سکتا ہے۔ فعال لائسنسیز کے تحت فراہم کردہ کوئی بھی کوڈ آپ کو ماخذ کوڈ میں ترمیم اور آپ کو ان کے شرائط کی تعمیل کے ساتھ ساتھ اپنے ترمیم شدہ ورژنز کو تقسیم کرنے کی اجازت دیتا ہے
about-your-rights-2 = آپ کو موزیلا فاؤنڈیشن یا کسی بھی فریق بشمول بغیر پابندی {{brandShortName}} کا نام یا لوگو کے ٹریڈ مارک کا کوئی حق یا لائسنس نہیں دیا گیا ہے۔
about-your-rights-3 = {{brandShortName}} کی کچھ خصوصیات، جیسے کریش رپورٹر، آپ کو موزیلا کو فیڈبیک دینے کا اختیار دیتا ہے۔ فیڈبیک جمع کرنے کو منتخب کرکے، آپ موزیلا کو اس فیڈ بیک کو اپنے پروڈکٹس کو بہتر بنانے میں استعمال کرنے، فیڈبیک کو اپنی ویب سائٹ پر شائع کرنے، اور فیڈبیک کو تقسیم کرنے کی اجازت دیتے ہیں۔
