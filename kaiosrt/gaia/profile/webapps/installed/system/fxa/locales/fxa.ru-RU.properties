about-kaios-account-text2 = Для создания аккаунта требуется адрес электронной почты и пароль. Пользователь должен подтвердить адрес электронной почты по ссылке в письме, отправленном при создании аккаунта. Аккаунт не будет активирован до тех пор, пока этот адрес электронной почты не будет подтвержден.
