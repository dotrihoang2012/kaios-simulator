cancel = لغو کردن
check-settings = بررسی تنظیمات
close = بستن
connection-failed = اتصال ممکن نيست
connection-failed-error = زمان رسیدن به سایت، یک خطای شبکه روی داد.
content-encoding = نمایش صفحه امکان‌پذیر نیست
content-encoding-error = دستگاه نمی تواند این صفحه را نشان دهد چون خطای رمزگذاری محتوا روی داد.
corrupted-content = اتصال ممکن نيست
corrupted-content-error = صفحه نشان داده نمی شود چون خطایی در انتقال داده ردیابی شد.
denied-port-access = آدرس محدود شد
denied-port-access-error = این آدرس از درگاه شبکه ای استفاده می کند که به طور معمول برای اهدافی جز مرور وب استفاده می شود. دستگاه درخواست را برای محافظت از شما لغو کرده است.
file-not-found = فايل يافت نشد
file-not-found-error = دستگاه نمی تواند این صفحه را نشان دهد چون فایل یافت نمی شود.
invalid-connection = اتصال ممکن نيست
invalid-connection-error = زمان رسیدن به سایت، یک خطای شبکه روی داد.
is-printing = دسترسی ممكن نيست
is-printing-error = زمان چاپ یا در حالت پیش نمایش چاپ، سند نمی تواند تغییر کند.
malformed-uri = URL معتبر نیست
malformed-uri-error = URL وارد شده معتبر نیست و قابل بارگیری نیست.
malware-blocked = حمله نرم افزار مخرب مسدود شد
malware-blocked-error = سایت به عنوان یک سایت حمله کننده گزارش شده است. دستگاه درخواست را برای محافظت از شما مسدود کرده است.
network-error-in-app = اکنون دسترسی به اینترنت وجود ندارد.
network-error-launching = {{name}} به اتصال اینترنت نیاز دارد.
network-error-launching-message = اتصال اینترنت ندارید. اکنون به اینترنت وصل می شوید؟
network-error-launching-title = اتصال اینترنتی وجود ندارد
not-cached = صفحه منقضی شده است
not-cached-error = به عنوان یک اقدام امنیتی، این صفحه توسط دستگاه نشان داده نمی شود چون منقضی شده است.
phishing-blocked = اخطار
phishing-blocked-error = وب سایت به عنوان یک وب جعلی گزارش شده است که برای فریب دادن کاربران طراحی شده است تا اطلاعات مالی یا شخصی خود را به اشتراک بگذارند.
proxy-connect-failure = خطای سرور پراکسی
proxy-connect-failure-error = دستگاه پیکربندی شده است تا از سرور پراکسی که اتصالات را رد می کند استفاده کند.
proxy-resolve-failure = خطای سرور پراکسی
proxy-resolve-failure-error = دستگاه پیکربندی شده است تا از سرور پراکسی که یافت نمی شود استفاده کند.
quit = خارج شدن
redirect-loop = نمایش صفحه امکان‌پذیر نیست
redirect-loop-error = دستگاه نمی تواند این صفحه را نشان دهد چون صفحه به درستی در مسیر خود قرار نگرفته است. در فرصتی دیگر دوباره روی این صفحه امتحان کنید.
refresh = نوسازی
remote-xul = صفحه پشتیبانی نمی شود
remote-xul-error = این صفحه نشان داده نمی شود چون از فناوری استفاده می کند که دستگاه آن را پشتیبانی نمی کند.
server-not-found = سرور یافت نشد
server-not-found-error = نمی توانید سرور را در {{name}} پیدا کنید.
settings = تنظیمات
tap-to-check-settings = ضربه برای بررسی تنظیمات
try-again = دوباره امتحان کنید
unable-to-connect = اتصال ممکن نيست
unknown-error = خطای ناشناخته ای روی داده است.
unknown-protocol-found = صفحه پشتیبانی نمی شود
unknown-protocol-found-error = صفحه نشان داده نمی شود چون از فناوری استفاده می کند که دستگاه آن را پشتیبانی نمی کند.
unsafe-content-type = محتوای غیرایمن
unsafe-content-type-error = صفحه نشان داده نمی شود چون برای باز شدن ایمن نیست.
