cancel = ยกเลิก
check-settings = ตรวจสอบการตั้งค่า
close = ปิด
connection-failed = ไม่สามารถเชื่อมต่อได้
connection-failed-error = เกิดข้อผิดพลาดระบบขึ้นขณะพยายามเข้าถึงไซต์
content-encoding = ไม่สามารถแสดงหน้าได้
content-encoding-error = อุปกรณ์ไม่สามารถแสดงหน้านี้ได้ เนื่องจากการเข้ารหัสเนื้อหาผิดพลาด
corrupted-content = ไม่สามารถเชื่อมต่อได้
corrupted-content-error = เพจไม่สามารถแสดงเนื่องจากพบข้อผิดพลาดในการส่งข้อมูล
denied-port-access = ที่อยู่ที่ถูกจำกัด
denied-port-access-error = ที่อยู่นี้ใช้พอร์ตเครือข่ายที่ใช้สำหรับวัตถุประสงค์อื่นๆ ที่ไม่ใช่การค้นดูเว็บ อุปกรณ์ได้ยกเลิกคำขอสำหรับการปกป้องของคุณ
file-not-found = ไม่พบไฟล์
file-not-found-error = อุปกรณ์ไม่สามารถแสดงหน้านี้ได้ เนื่องจากไม่พบไฟล์
invalid-connection = ไม่สามารถเชื่อมต่อได้
invalid-connection-error = เกิดข้อผิดพลาดระบบขึ้นขณะพยายามเข้าถึงไซต์
is-printing = การเข้าถึงถูกปฏิเสธ
is-printing-error = เอกสารไม่สามารถเปลี่ยนขณะพิมพ์หรือแสดงตัวอย่างการพิมพ์ได้
malformed-uri = URL ไม่ถูกต้อง
malformed-uri-error = URL ที่ป้อนไม่ถูกต้องและไม่สามารถโหลดได้
malware-blocked = การโจมตีจากมัลแวร์ถูกบล็อก
malware-blocked-error = ไซต์นี้ถูกรายงานเป็นไซต์ที่โจมตี อุปกรณ์ได้บล็อกคำขอสำหรับการปกป้องของคุณ
network-error-in-app = ไม่มีการเข้าถึงอินเตอร์เน็ตในขณะนีเ
network-error-launching = {{name}} ส่งคำขอการเชื่อมต่ออินเทอร์เน็ต
network-error-launching-message = คุณไม่มีการเชื่อมต่ออินเทอร์เน็ต เชื่อมต่ออินเทอร์เน็ตตอนนี้หรือไม่
network-error-launching-title = ไม่มีการเชื่อมต่ออินเทอร์เน็ต
not-cached = หน้าหมดอายุแล้ว
not-cached-error = เนื่องจากการแจ้งเตือนความปลอดภัย หน้านี้จึงไม่สามารถแสดงได้โดยอุปกรณ์ เนื่องจากได้หมดอายุแล้ว
phishing-blocked = คำเตือน
phishing-blocked-error = เว็บไซต์นี้ถูกรายงานเป็นเว็บปลอมที่หลอกลวงผู้ใช้ให้แชร์ข้อมูลส่วนตัวหรือข้อมูลทางการเงิน
proxy-connect-failure = ข้อผิดพลาดพร็อกซีเซิร์ฟเวอร์
proxy-connect-failure-error = อุปกรณ์นี้ถูกกำหนดค่าใช้ให้พร็อกซีเซิร์ฟเวอร์ที่ปฏิเสธการเชื่อมต่อ
proxy-resolve-failure = ข้อผิดพลาดพร็อกซีเซิร์ฟเวอร์
proxy-resolve-failure-error = อุปกรณ์นี้ถูกกำหนดค่าใช้ให้พร็อกซีเซิร์ฟเวอร์ที่ค้นหาไม่พบ
quit = ออก
redirect-loop = ไม่สามารถแสดงหน้าได้
redirect-loop-error = อุปกรณ์ไม่สามารถแสดงหน้านี้ได้ เนื่องจากหน้านี้ไม่ได้เปลี่ยนทิศทางอย่างเหมาะสม ลองเข้าหน้านี้ใหม่ในภายหลัง
refresh = รีเฟรช
remote-xul = เพจไม่ได้รับการรองรับ
remote-xul-error = เพจนี้ไม่สามารถแสดงได้เนื่องจากใช้เทคโนโลยีที่ไม่ได้รับการรองรับบนอุปกรณ์
server-not-found = ไม่พบเซิร์ฟเวอร์
server-not-found-error = ไม่สามารถค้นหาเซิร์ฟเวอร์ที่ {{name}}
settings = การตั้งค่า
tap-to-check-settings = แตะเพื่อตรวจสอบการตั้งค่า
try-again = ลองอีกครั้ง
unable-to-connect = ไม่สามารถเชื่อมต่อได้
unknown-error = เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ
unknown-protocol-found = เพจไม่ได้รับการรองรับ
unknown-protocol-found-error = เพจนี้ไม่สามารถแสดงได้เนื่องจากใช้เทคโนโลยีที่ไม่ได้รับการรองรับบนอุปกรณ์
unsafe-content-type = เนื้อหาที่ไม่ปลอดภัย
unsafe-content-type-error = เพจไม่สามารถแสดงได้เนื่องจากไม่ปลอดภัยเมื่อเปิด
