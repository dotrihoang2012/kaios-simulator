crash-reports-description-1 = சிதைவு அறிக்கையில், சிதைவு மற்றும் உங்கள் சாதனத்தைப் பற்றிய சில விவரங்களுடன், உங்கள் சாதனம் சிதைவடைந்த போது இருந்த அதன் நிலையின் புகைப்படமும் இருக்கும்.
crash-reports-description-2 = ஓபன் பேஜ்-கள் மற்றும் ஆப்-கள், டெக்ஸ்ட் பார்மாக டைப் செய்யப்பட்டது மற்றும் ஓபன் செய்திகளின் ஓபன் கன்டென்ட், சமீபத்திய ப்ரௌசிங் வரலாறு, அல்லது ஓபன் ஆப் மூலமாக ஜியோலொக்கேஷன் பயன்படுத்தப்பட்டது போன்ற பொருட்கள் இதில் உள்ளடங்கும்.
