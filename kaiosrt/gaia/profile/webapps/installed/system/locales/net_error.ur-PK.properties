cancel = منسوخ کریں
check-settings = سیٹنگز دیکھیں
close = بند کریں
connection-failed = جڑنے سے قاصر
connection-failed-error = سائٹ تک پہنچنے کی کوشش کے دوران ایک نیٹ ورک کی خرابی واقع ہوئی
content-encoding = صفحہ نہیں دکھایا جاسکتا
content-encoding-error = مواد کے اینکوڈنگ کی خرابی واقع ہونے کی وجہ سے آلہ اس صفحہ کو نہیں دکھا سکتا۔
corrupted-content = جڑنے سے قاصر
corrupted-content-error = ڈیٹا کی منتقلی میں خرابی کی شناخت ہونے کی وجہ سے صفحہ نہیں دکھایا جاسکتا۔
denied-port-access = پتہ پر پابندی
denied-port-access-error = یہ پتہ نیٹ ورک پورٹ کا استعمال کرتا ہے جو کہ عام طور پر ویب براؤزنگ کے علاوہ دیگر مقاصد کیلئے استعمال کیا جاتا ہے۔ آلہ نے آپ کے تحفظ کی اجازت کو منسوخ کردیا ہے۔
file-not-found = فائل نہیں ملی
file-not-found-error = فائل نہ مل نے کی وجہ سے آلہ اس صفحہ کو نہیں دکھا سکتا۔
invalid-connection = جڑنے سے قاصر
invalid-connection-error = سائٹ تک پہنچنے کی کوشش کے دوران ایک نیٹ ورک کی خرابی واقع ہوئی
is-printing = رسائی رد کردی گئی
is-printing-error = دستاویز پرنٹنگ یا پرنٹ پیش منظر کے دوران تبدیل نہیں کیا جاسکتا۔
malformed-uri = URL مجاز نہیں ہے
malformed-uri-error = درج کردہ URL مجاز نہیں ہے اور لوڈ نہیں کیا جاسکتا۔
malware-blocked = مالوئیر حملہ بلاک کیا گيا
malware-blocked-error = سائٹ کو حملہ کی سائٹ کے طور پر رپورٹ کیا گیا ہے۔ آلہ نے آپ کے تحفظ کی اجازت کو بلاک کردیا ہے۔
network-error-in-app = فی الحال انٹرنیٹ تک کوئی رسائی نہیں۔
network-error-launching = {{name}} کو انٹرنیٹ کنکیشن درکار ہے۔
network-error-launching-message = آپ کے پاس انٹرنیٹ کنیکشن نہیں ہے۔ ابھی انٹرنیٹ سے رابطہ کریں؟
network-error-launching-title = کوئی انٹرنیٹ کنیکشن نہیں
not-cached = صفحہ کی مدت ختم ہوگئی
not-cached-error = سکیورٹی کی احتیاط کے طور پر، یہ صفحہ آلہ کے ذریعے نہیں دکھایا جاسکتا ہے چونکہ اس کی مدت ختم ہوچکی ہے۔
phishing-blocked = تنبیہ
phishing-blocked-error = اس ویب سائٹ کی رپوٹ جعل سازی کے طور پر کی گئی ہے جس میں صارفین کی ذاتی یا مالی معلومات کا اشتراک کرنے کی چال بنائی گئی ہے۔
proxy-connect-failure = پراکسی سرور کا نقص
proxy-connect-failure-error = آلہ ایسے پراکسی سرور کا استعمال پر تشکیل کیا گیا ہے جو کنیکشنز کو قبول نہیں کررہا ہے۔
proxy-resolve-failure = پراکسی سرور کا نقص
proxy-resolve-failure-error = آلہ ایسے پراکسی سرور کا استعمال پر تشکیل کیا گیا ہے جو نہیں مل سکتا ہے۔
quit = چھوڑیں
redirect-loop = صفحہ نہیں دکھایا جاسکتا
redirect-loop-error = صفحہ کے درست طریقے سے ری ڈائریکٹ نہ ہونے کی وجہ سے آلہ اس صفحہ کو نہیں دکھا سکتا۔ اس صفحہ کو کھولنے کی کچھ وقت بعد دوبارہ کوشش کریں۔
refresh = ریفریش کریں
remote-xul = صفحہ غیر تائید یافتہ
remote-xul-error = اس صفحہ کو ڈسپلے نہیں کیا جاسکتا چونکہ یہ ایسی تکنالوجی استعمال کرتا ہے جس کی آپ کا آلہ تائید نہیں کرتا۔
server-not-found = سرور نہیں ملا
server-not-found-error = {{name}} پر سرور نہیں تلاش کیا جاسکتا۔
settings = ترتیبات
tap-to-check-settings = سیٹنگز چیک کرنے کیلئے تھپکی دیں
try-again = دوبارہ کوشش کریں
unable-to-connect = جڑنے سے قاصر
unknown-error = ایک نامعلوم نقص واقع ہوا ہے۔
unknown-protocol-found = صفحہ غیر تائید یافتہ
unknown-protocol-found-error = صفحہ ڈسپلے نہیں کیا جاسکتا چونکہ یہ ایسی تکنالوجی استعمال کرتاہے جس کی آپ کا آلہ تائید نہیں کرتا۔
unsafe-content-type = غیر محفوظ مواد
unsafe-content-type-error = صفحہ نہیں دکھایا جاسکتا کیوں کہ اسے کھولنے سے تحفظ کا خطرہ ہوسکتا ہے۔
