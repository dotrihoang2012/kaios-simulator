cancel = বাতিল করুন
check-settings = সেটিংস পরীক্ষা করুন
close = বন্ধ করুন
connection-failed = সংযোগ করা যাচ্ছে না
connection-failed-error = সাইটটিতে পৌঁছাবার চেষ্টা করার সময় একটি নেটওয়ার্ক ত্রুটি ঘটেছে I
content-encoding = পেজ প্রদর্শন করা যাচ্ছে না
content-encoding-error = ডিভাইসটি এই পেজটি প্রদর্শন করতে পারবে না কারণ একটি বিষয়বস্তু এনকোড করার ত্রুটি ঘটেছে ।
corrupted-content = সংযোগ করা যাচ্ছে না
corrupted-content-error = পেজটি দেখানো যাবে না কারণ ডেটা প্রেরণে একটি ত্রুটি সনাক্ত হয়েছে ।
denied-port-access = ঠিকানা সীমাবদ্ধ আছে
denied-port-access-error = এই ঠিকানাটি একটি নেটওয়ার্ক পোর্ট ব্যবহার করছে যা সাধারণ ওয়েব ব্রাউজ করা ছাড়া অন্য উদ্দেশ্যে ব্যবহার করা হয়। আপনার সুরক্ষার জন্য ডিভাইসটি অনুরোধটি অবরুদ্ধ করেছে ।
file-not-found = ফাইল খুজে পাওয়া যায় নি
file-not-found-error = ডিভাইসটি এই পেজটি প্রদর্শন করতে পারবে না কারণ ফাইলটি খুঁজে পাওয়া যায় নি ।
invalid-connection = সংযোগ করা যাচ্ছে না
invalid-connection-error = সাইটটিতে পৌঁছাবার চেষ্টা করার সময় একটি নেটওয়ার্ক ত্রুটি ঘটেছে I
is-printing = অ্যাক্সেস ডিনাইড
is-printing-error = প্রিন্ট করার সময় বা প্রিন্ট প্রিভিউয়ের সময় ডকুমেন্টটি পরিবর্তন করা যাবে না ।
malformed-uri = URL বৈধ নয়
malformed-uri-error = লেখা URLটি বৈধ নয় এবং লোড করা যাবে না।
malware-blocked = ম্যালওয়্যারের আক্রমণ অবরুদ্ধ করা হয়েছে
malware-blocked-error = সাইটটি আক্রমণাত্মক সাইট বলে রিপোর্ট করা হয়েছে। আপনার সুরক্ষার জন্য ডিভাইসটি অনুরোধটি অবরুদ্ধ করেছে।
network-error-in-app = এই মুহুর্তে ইন্টারনেট অ্যাক্সেস নেই ।
network-error-launching = {{name}}-এর ইন্টারনেট সংযোগ আবশ্যক ।
network-error-launching-message = আপনার কাছে ইন্টারনেট সংযোগ নেই। এখনই ইন্টারনেট সংযোগ করবেন ।
network-error-launching-title = কোনো ইন্টারনেট সংযোগ নেই
not-cached = পেজের মেয়াদ উত্তীর্ণ
not-cached-error = একটি সুরক্ষামূলক সাবধানতা হিসেবে, এই পেজটি এই ডিভাইসটি দ্বারা দেখানো যাবে না, কারণ এটির মেয়াদ পেরিয়ে গেছে ।
phishing-blocked = সতর্কতা
phishing-blocked-error = ওয়েবসাইটটি জালিয়াতি হিসেবে রিপোর্ট করা হয়েছে, যেটি ইউজারদের থেকে তাদের ব্যক্তিগত বা আর্থিক শেয়ার করে বিপদে ফেলার জন্য তৈরী হয়েছে ।
proxy-connect-failure = প্রক্সি সার্ভারের ত্রুটি
proxy-connect-failure-error = ডিভাইসটি একটি প্রক্সি সার্ভার ব্যবহার করতে কনফিগার করা হয়েছে যেটি সংযোগ প্রত্যাখান করছে ।
proxy-resolve-failure = প্রক্সি সার্ভারের ত্রুটি
proxy-resolve-failure-error = ডিভাইসটি একটি প্রক্সি সার্ভার ব্যবহার করতে কনফিগার করা হয়েছে যেটি খুঁজে পাওয়া যায় নি ।
quit = প্রস্থান
redirect-loop = পেজ প্রদর্শন করা যাচ্ছে না
redirect-loop-error = ডিভাইসটি এই পেজটি প্রদর্শন করতে পারবে না কারণ পেজটি সঠিকভাবে পুননির্দেশিত হয় নি। পরে কোনো সময় এই পেজটি আবার চেষ্টা করুন ।
refresh = রিফ্রেশ করুন
remote-xul = পেজ অসমর্থিত
remote-xul-error = এই পেজটি প্রদর্শন করা যাবে না কারণ এটি এমন একটি প্রযুক্তি ব্যবহার করে যা এই ডিভাইসে সমর্থিত নয় ।
server-not-found = সার্ভার খুঁজে পাওয়া যায় নি
server-not-found-error = {{name}} -এ সার্ভার খুজে পাওয়া করা যাচ্ছে না ।
settings = সেটিংস
tap-to-check-settings = সেটিংস পরীক্ষা করতে ট্যাপ করুন
try-again = আবার চেষ্টা করুন
unable-to-connect = সংযোগ করা যাচ্ছে না
unknown-error = একটি অজানা ত্রুটি ঘটেছে ।
unknown-protocol-found = পেজ অসমর্থিত
unknown-protocol-found-error = পেজ দেখানো যাবে না কারণ এটি একটি প্রযুক্তি ব্যবহার করে যা আপনার ডিভাইসে সমর্থিত নয় ।
unsafe-content-type = অসুরক্ষিত বিষয়বস্তু
unsafe-content-type-error = পেজটি দেখানো যাবে না কারণ এটি খোলা সুরক্ষিত নাও হতে পারে ।
