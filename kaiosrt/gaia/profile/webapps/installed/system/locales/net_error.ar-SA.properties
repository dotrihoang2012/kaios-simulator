cancel = ألغِ
check-settings = إعدادات التحقق
close = إغلاق
connection-failed = تعذّر الاتصال
connection-failed-error = حدث خطأ في الشبكة أثناء محاولة الوصول إلى الموقع.
content-encoding = يتعذر عرض الصفحة
content-encoding-error = يتعذر على الجهاز عرض هذه الصفحة نظرًا لحدوث خطأ في ترميز المحتوى.
corrupted-content = تعذّر الاتصال
corrupted-content-error = يتعذر عرض الصفحة لأنه تم الكشف عن خطأ في نقل البيانات.
denied-port-access = تم تقييد العنوان
denied-port-access-error = يستخدم هذا العنوان منفذ شبكة يُستخدم عادة لأغراض أخرى غير تصفح الويب. لقد ألغى الجهاز طلب الحماية الخاص بك.
file-not-found = الملف غير موجود
file-not-found-error = يتعذر على الجهاز عرض هذه الصفحة نظرًا لتعذر العثور على الملف.
invalid-connection = تعذّر الاتصال
invalid-connection-error = حدث خطأ في الشبكة أثناء محاولة الوصول إلى الموقع.
is-printing = تم رفض الوصول
is-printing-error = لا يمكن تغيير المستند أثناء الطباعة أو في وضع معاينة الطباعة.
malformed-uri = عنوان URL غير صالح
malformed-uri-error = عنوان URL الذي تم إدخاله غير صالح ولا يمكن تحميله.
malware-blocked = تم حظر هجوم برنامج ضار
malware-blocked-error = تم الإبلاغ عن هذا الموقع كموقع هجوم. قام الجهاز بحظر طلب الحماية الخاص بك.
network-error-in-app = لا يوجد اتصال بالإنترنت حاليًا.
network-error-launching = {{name}} يتطلب وجود اتصال بالإنترنت.
network-error-launching-message = ليس لديك اتصال بالإنترنت. هل ترغب في الاتصال بالإنترنت الآن؟
network-error-launching-title = لا يوجد اتصال بالإنترنت
not-cached = انتهت صلاحية الصفحة
not-cached-error = كإجراء وقائي، لا يمكن عرض هذه الصفحة بواسطة الجهاز نظرًا لانتهاء صلاحيتها.
phishing-blocked = تحذير
phishing-blocked-error = تم الإبلاغ عن موقع الويب باعتباره تزييف في الويب يهدف إلى خداع المستخدمين من خلال مشاركة المعلومات الشخصية أو المالية.
proxy-connect-failure = خطأ بالخادم الوكيل
proxy-connect-failure-error = تم تكوين الجهاز لاستخدام خادم وكيل يرفض الاتصالات.
proxy-resolve-failure = خطأ بالخادم الوكيل
proxy-resolve-failure-error = تم تكوين الجهاز لاستخدام خادم وكيل لا يمكن العثور عليه.
quit = أنهِ
redirect-loop = يتعذر عرض الصفحة
redirect-loop-error = يتعذر على الجهاز عرض هذه الصفحة لأن الصفحة لا تعيد التوجيه بشكل صحيح. جرب هذه الصفحة مرة أخرى في وقت لاحق.
refresh = تحديث
remote-xul = الصفحة غير مدعومة
remote-xul-error = يتعذر عرض هذه الصفحة لأنها تستخدم تقنية غير مدعومة على الجهاز.
server-not-found = لم يتم العثور على الخادم
server-not-found-error = يتعذر العثور على الخادم على {{name}}.
settings = الإعدادات
tap-to-check-settings = اضغط للتحقق من الإعدادات
try-again = أعِد المحاولة
unable-to-connect = تعذّر الاتصال
unknown-error = حدث خطأ غير معروف.
unknown-protocol-found = الصفحة غير مدعومة
unknown-protocol-found-error = يتعذر عرض الصفحة لأنها تستخدم تقنية غير مدعومة على الجهاز.
unsafe-content-type = محتوى غير آمن
unsafe-content-type-error = لا يمكن عرض الصفحة لأنها قد لا تكون آمنة.
