<element name="downloads" extends="section">
  <template>
    <gaia-header id="downloads-header" data-href="#root">
      <h1 slot="text" data-l10n-id="downloads-panel-header"></h1>
    </gaia-header>
    <gaia-header id="downloads-edit-header" hidden="hidden">
      <h1 slot="text" class="selectnumber" data-l10n-id="downloads-selected"></h1>
    </gaia-header>
    <section id="download-list-empty" class="hidden">
      <span id="dle-text"></span>
    </section>
    <section id="download-confirm-dialog" hidden="hidden">
      <p id="dle-text" data-l10n-id="no-downloads"></p>
    </section>
    <div id="downloadList" data-type="list">
      <ul role="menu">
      </ul>
    </div>
    <panel data-path="panels/downloads/panel"></panel>
  </template>
</element>
