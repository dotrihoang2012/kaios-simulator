<element name="hotspot_wifi_settings" extends="section">
  <template>

    <gaia-header>
      <h1 slot="text" data-l10n-id="hotspotSettings-header" data-href="#hotspot"></h1>
    </gaia-header>

    <div>
      <ul role="menu">
        <li role="menuitem" id="hotspot-name">
          <span data-l10n-id="ssid-name">SSID Network Name</span>
          <input type="text" maxlength="32" dir="auto"/>
        </li>
        <li role="menuitem" id="hotspot-security">
          <span data-l10n-id="wifi-security">Security</span>
          <div class="button icon icon-dialog">
            <select>
              <option data-l10n-id="hotspot-open" value="open"></option>
              <option data-l10n-id="hotspot-wpa-psk" value="wpa-psk"></option>
              <option data-l10n-id="hotspot-wpa2-psk" value="wpa2-psk"></option>
            </select>
          </div>
        </li>

        <li role="menuitem" id="hotspot-password" class="password input auto-height">
          <span data-l10n-id="wifi-password">Password</span>
          <input type="text" name="password" maxlength="63" x-inputmode="plain"/>
          <p data-l10n-id="hotspot-password-desc"></p>
        </li>
      </ul>
    </div>

    <panel data-path="panels/hotspot_wifi_settings/panel"></panel>

  </template>
</element>
