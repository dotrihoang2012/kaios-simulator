about-your-rights-0 = {{brandShortName}} روی نرم افزار منبع باز و رایگان با انجمنی از هزاران عضو در سراسر جهان تهیه شده است. مواردی است که باید بدانید:
about-your-rights-1 = {{brandShortName}} تحت شرایط چندین مجوز منبع باز از جمله مجوز عمومی Mozilla در دسترس شما قرار دارد. دستگاهی که دارای {{brandShortName}} است ممکن است شامل نرم افزار اختصاصی از اشخاص ثالث شود. هر کدی که تحت مجوز باز ارائه می شود به شما این حق را می دهد که کد منبع را تغییر دهید و نسخه های تغییر کرده تان را تا زمانی که مطابق با شرایط آنها عمل کنید توزیع نمایید.
about-your-rights-2 = هیچ حقوق علامت تجاری یا مجوزی برای علامت های تجاری بنیاد Mozilla یا هر شخصی از جمله بدون محدودیت آرم یا نام {{brandShortName}} به شما اعطا نمی شود.
about-your-rights-3 = برخی از ویژگی ها در {{brandShortName}}، مانند گزارشگر خرابی، به شما کمک می کند برای Mozilla بازخورد ارائه دهید. با انتخاب ارسال بازخورد، به Mozilla اجازه می دهید از بازخورد برای بهبود محصولات خود استفاده کند، بازخورد را در وب سایت های خود انتشار دهد و بازخورد را توزیع کند.
