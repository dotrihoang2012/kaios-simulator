about-your-rights-0 = {{brandShortName}} สร้างขึ้นในซอฟต์แวร์โอเพ่นซอร์สที่ใช้งานฟรีโดยชุมชนของผู้คนนับพันทั่วโลก มีบางสิ่งที่คุณควรทราบ:
about-your-rights-1 = {{brandShortName}} สร้างขึ้นภายใต้ข้อกำหนดใบอนุญาตโอเพ่นซอร์สหลายข้อ รวมทั้ง Mozilla Public License อุปกรณ์ที่ใช้งาน{{brandShortName}} อาจประกอบด้วยซอฟต์แวร์ที่เป็นของบุคคลที่สาม รหัสที่ให้ภายใต้ใบอนุญาตโอเพ่นจะให้สิทธิ์คุณในการแก้ไขซอร์สโค้ดและแจกจ่ายเวอร์ชันที่คุณแก้ไข หากคุณปฏิบัติตามข้อกำหนด
about-your-rights-2 = คุณไม่ได้รับสิทธิ์เครื่องหมายการค้าหรือใบอนุยาตเครื่องมือหมายการค้าของ Mozilla Foundation หรือหน่วยงานอื่นๆ รวมทั้งไม่มีข้อจำกัดของชื่อและโลโก้ {{brandShortName}}
about-your-rights-3 = คุณสมบัติบางอย่างใน {{brandShortName}} เช่น การรายงานการปิดตัว ทำให้คุณมีตัวเลือกในการให้ความคิดเห็นกับ Mozilla การเลือกส่งความคิดเห็น หมายความว่าคุณให้การอนุญาตกับ Mozilla ในการปรับปรุงผลิตภัณฑ์ เผยแพร่ความคิดเห็นบนเว็บไซต์ และแจกจ่ายความคิดเห็นดังกล่าว
