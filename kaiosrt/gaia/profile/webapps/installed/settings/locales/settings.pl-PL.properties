about-your-rights-0 = Wielotysięczna społeczność z całego świata opracowała {{brandShortName}} na podstawie oprogramowania darmowego i open source. Jest kilka spraw, o których muszą pamiętać użytkownicy:
about-your-rights-1 = {{brandShortName}} udostępniane jest użytkownikom na mocy kilku licencji open source, w tym Mozilla Public License. Urządzenie, na którym zainstalowane jest {{brandShortName}}, może także zawierać własnościowe oprogramowanie od stron trzecich. Wszelki kod dostarczany na mocy licencji open source daje użytkownikowi prawo modyfikacji kodu źródłowego oraz udostępniania zmodyfikowanych wersji pod warunkiem przestrzegania warunków określanych przez te strony.
about-your-rights-2 = Użytkownikowi nie nadaje się żadnych praw ani licencji do znaków towarowych należących do Mozilla Foundation ani żadnej innej strony, w tym między innymi do nazwy lub logo {{brandShortName}}.
about-your-rights-3 = Niektóre funkcje {{brandShortName}}, takie jak raportowanie o błędach (Crash Reporter), dają użytkownikowi możliwość przesyłania raportów do Mozilli. Decydując się na przesłanie takiego raportu, użytkownik udziela organizacji Mozilla zezwolenia na wykorzystanie przesłanych informacji w celu doskonalenia produktów, publikowania danych na stronach internetowych oraz dalszej dystrybucji.
