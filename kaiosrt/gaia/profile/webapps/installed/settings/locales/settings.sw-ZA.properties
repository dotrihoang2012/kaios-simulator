about-your-rights-0 = {{brandShortName}} imeundwa kwenye programu huru an awazi na jamii ya maelfu ya watu kutoka duniani kote. Kuna mambo machache unayofaa kujua:
about-your-rights-1 = {{brandShortName}} imetolewa kwako chini ya sheria za leseni kadhaa wazi ikiwa ni pamoja na Leseni ya Umma ya Mozilla. Kifaa kinachotumia {{brandShortName}} pia kinaweza kuwa na programu inayomilikiwa na watu wa tatu. Msimbo wowote uliotolewa chini ya leseni wazi unakuaptia haki ya kubdilisha msimbo chanzo na kusambaza matokeo iliyobadilisha bora tu uzingatie sheria zao.
about-your-rights-2 = Hujapewa haki za alama yoyote ya biashara au leseni za alama za biashara za Mozilla Foundation au mshiriki yoyote, ikiwa ni pamoja na, lakini bila kikomo, jina au nembo ya {{brandShortName}}.
about-your-rights-3 = Baadhi ya vipengele katika {{brandShortName}}, kama vile Crash Reporter, hukupatia hiari ya kutoa maoni kwa Mozilla. Kwa kuchagua kuwasilisha maoni, unaipatia Mozilla ruhusa ya kutumia maoni unayotoa kuboresha bidhaa, kuchapisha maoni kwenye tovuti zake, na kusambaza maoni hayo.
