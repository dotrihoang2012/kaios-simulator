about-your-rights-0 = {{brandShortName}} yakhiwa kwisofthiwe yamahhala umphakathi wezinkulungwane ovela kuwo wonke umhlaba. Kunezinto ezimbalwa okufanele uzazi:
about-your-rights-1 = {{brandShortName}} yenziwa itholakele kuwe ngaphansi kwemibandela yamalayisenisi amaningana avulekele wonke umuntu kuhlanganisa neLayisenisi Yomphakathi Ye-Mozilla. Idivayisi esebenza nge {{brandShortName}} ingase ibe nesofthiwe eyenziwe izinkampani eziseceleni. Noma iyiphi ikhodi etholakala ngaphansi kwamalayisensi avuleke umphakathi ikunika ilungelo lokushintsha indlela emi ngayo futhi ungasakaza ikhodi lakho eselithuthukisiwe uma nje uhlonipha imigomo nemibandela yabo.
about-your-rights-2 = Awunikwa amalungelo e-trademark noma ilayisensi ye-trademark ye-Mozilla Foundation nanoma iyiphi inhlangano, kuhlanganise ne {{brandShortName}}igama nesithombe sabo.
about-your-rights-3 = Ezinye izinto ku {{brandShortName}}, njenge-Crash Reporter, zikunika indlela yokuxhumana no-Mozilla. Ngokukhetha ukuxhumana nabo ubatshele umbono wakho, unikeza abakwa-Mozilla imvume yokusebenzisa lokho okuphawulile ukuze bathuthukise umkhiqizo wabo, babhale lokho kuphawula kumawebhusayithi abo, nokukusakaza lokho kuphawula.
