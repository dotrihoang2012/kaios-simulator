feedback-errormessage-just-sent = দুঃখিত, সিস্টেমটি আপনার পরামর্শ পাঠাতে পারে নি কারণ আপনি ইতিমধ্যে আমাদের একটি প্রতিক্রিয়া পাঠিয়েছেন। অনুগ্রহ করে আমাদের পরবর্তী সফ্টওয়্যার আপডেট করার চেষ্টা করুন এবং আবার পাঠান।
