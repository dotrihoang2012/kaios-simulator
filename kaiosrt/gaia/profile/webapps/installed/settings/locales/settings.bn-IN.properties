about-your-rights-1 = {{brandShortName}} আপনার কাছে Mozilla পাবলিক লাইসেন্স সহ একাধিক ওপেন সোর্সের শর্তাবলীর অধীনে উপলব্ধ করা হয়েছে। {{brandShortName}} দ্বারা পরিচালিত কোনো ডিভাইসে তৃতীয় পক্ষদের মালিকাধীন সফ্টওয়্যার থাকতে পারে। ওপেন লাইসেন্সের অধীনে প্রদত্ত যেকোনো কোড আপনাকে সোর্স কোড সংশোধন করতে এবং আপনার সংশোধিত সংস্করণ বিতরণের অধিকার দেয়, আপনি যতদিন তাদের শর্তাবলী মেনে চলবেন আপনি এই সুবিধা পাবেন
about-your-rights-2 = আপনি Mozilla ফাউন্ডেশনা বা অন্য কোনো পক্ষের ট্রেডমার্কদেরকে {{brandShortName}} এর নাম বা লোগো সীমা না রেখে তা সহ ট্রেডমার্ক অধিকার বা লাইসেন্সের অনুমতি দিচ্ছেন না।
about-your-rights-3 = {{brandShortName}}-এ কিছু বৈশিষ্ট্য, যেমন ক্র্যাশ রিপোর্টার, আপনাকে, Mozilla-কে প্রতিক্রিয়া প্রদান করার একটি বিকল্প দেয়। প্রতিক্রিয়া জমা দেওয়া বেছে নেওয়ার দ্বারা, আপনি Mozilla-কে তার পণ্যগুলি উন্নত করতে প্রতিক্রিয়াটি ব্যবহার করার, প্রতিক্রিয়াটি তার ওয়েবসাইটে প্রকাশ করার, এবং প্রতিক্রিয়াটি বিতরণ করার অনুমতি দিচ্ছেন।
