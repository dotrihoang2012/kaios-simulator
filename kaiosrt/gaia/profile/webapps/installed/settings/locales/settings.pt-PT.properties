about-your-rights-2 = Não lhe são concedidos direitos de marca comercial ou licenças para as marcas comerciais da Mozilla Foundation ou qualquer parte, incluindo sem limitação o nome e logótipo {{brandShortName}}.
about-your-rights-3 = Algumas funções no {{brandShortName}}, tal como o Crash Reporter, dão-lhe a opção de fornecer feedback à Mozilla. Ao escolher enviar feedback, dá permissão à Mozilla para utilizar o feedback para melhorar os seus produtos, para publicar o feedback nos seus websites e para distribuir o feedback.
