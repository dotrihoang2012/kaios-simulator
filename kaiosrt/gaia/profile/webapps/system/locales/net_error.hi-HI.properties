cancel = रद्द करें
check-settings = सेटिंग्स जांचे
close = बंद करें
connection-failed = कनेक्ट करने में असमर्थ
connection-failed-error = साइट तक पहुँचने का प्रयास करते समय एक नेटवर्क त्रुटि हुई।
content-encoding = पेज डिस्प्ले नहीं किया जा सकता
content-encoding-error = कंटेंट एनकोडिंग त्रुटि होने के कारण डिवाइस यह पेज नहीं दिखा सकता।
corrupted-content = कनेक्ट करने में असमर्थ
corrupted-content-error = पेज दिखाया नहीं जा सकता क्योंकि डेटा ट्रांसमिशन में त्रुटि का पता चला था।
denied-port-access = पता प्रतिबंधित हैं
denied-port-access-error = यह पता एक ऐसे नेटवर्क पोर्ट का उपयोग करता हैं, जिसका उपयोग आम तौर पर वेब ब्राउज़िंग के अलावा अन्य उद्देश्यों के लिए किया जाता हैं। आपकी सुरक्षा के लिए डिवाइस ने अनुरोध को रद्द कर दिया हैं।
file-not-found = फ़ाइल नहीं मिली
file-not-found-error = फ़ाइल नहीं मिल पाने के कारण डिवाइस इस पेज को डिस्प्ले नहीं कर सकती।
invalid-connection = कनेक्ट करने में असमर्थ
invalid-connection-error = साइट तक पहुँचने का प्रयास करते समय एक नेटवर्क त्रुटि हुई।
is-printing = एक्सेस डिनाइड
is-printing-error = डॉक्युमेंट में फेरबदल नहीं कर सकते जब प्रिंट हो रहा हो या प्रिंट प्रिव्यू में हो
malformed-uri = URL मान्य नहीं हैं
malformed-uri-error = दर्ज किया गया URL मान्य नहीं हैं और लोड नहीं किया जा सकता।
malware-blocked = मैलवेयर आक्रमण रोका गया
malware-blocked-error = साइट को एक हमला साइट के रूप में रिपोर्ट किया गया हैं। डिवाइस ने आपकी सुरक्षा के लिए अनुरोध को ब्लॉक कर दिया हैं।
network-error-in-app = अभी इंटरनेट एक्सेस नहीं हैं
network-error-launching = {{name}} को इंटरनेट कनेक्शन की आवश्यकता हैं।
network-error-launching-message = आपके पास इंटरनेट कनेक्शन नहीं है। अब इंटरनेट से कनेक्ट करें।
network-error-launching-title = कोई इंटरनेट कनेक्शन नहीं
not-cached = पेज की समय-सीमा समाप्त
not-cached-error = सुरक्षा सावधानी के रूप में, यह पेज डिवाइस द्वारा डिस्प्ले नहीं किया जा सकता क्योंकि इसकी समय-सीमा समाप्त हो गई हैं।
phishing-blocked = चेतावनी
phishing-blocked-error = वेबसाइट को एक वेब जालसाज़ी के रूप में रिपोर्ट किया गया हैं, जिसे उपयोगकर्ताओं को व्यक्तिगत या वित्तीय जानकारी साझा करने हेतु फंसाने के लिए तैयार किया गया हैं।
proxy-connect-failure = प्रॉक्सी सर्वर त्रुटि
proxy-connect-failure-error = डिवाइस को ऐसे प्रॉक्सी सर्वर का उपयोग करके कॉन्फ़िगर किया गया हैं जो कनेक्शन को अस्वीकार रहा हैं|
proxy-resolve-failure = प्रॉक्सी सर्वर त्रुटि
proxy-resolve-failure-error = डिवाइस को ऐसे प्रॉक्सी सर्वर का उपयोग करके कॉन्फ़िगर किया गया हैं जिसे पाया नहीं जा सकता।
quit = निकलें
redirect-loop = पेज डिस्प्ले नहीं किया जा सकता
redirect-loop-error = पेज को सही तरीके से पुनः निर्देशित न होने के कारण डिवाइस इस पेज को डिस्प्ले नहीं कर सकती। बाद में इस पेज का पुनः प्रयास करें।
refresh = रीफ़्रेश करें
remote-xul = पेज असमर्थित
remote-xul-error = यह पेज दिख नहीं सकता क्यूंकि इसमें वह तकनीक का इस्तिमाल हुआ हैं जो आपका डिवाइस समर्थित नहीं करता
server-not-found = सर्वर नहीं मिला
server-not-found-error = {{name}} पर सर्वर नहीं ढूँढ सके।
settings = सेटिंग्स
tap-to-check-settings = सेटिंग्स जांचने के लिए टैप करें
try-again = फिर से प्रयास करें
unable-to-connect = कनेक्ट करने में असमर्थ
unknown-error = कोई अज्ञात त्रुटि हुई।
unknown-protocol-found = पेज असमर्थित
unknown-protocol-found-error = पेज डिस्प्ले नहीं किया जा सकता क्योंकि यह एक ऐसी तकनीक का उपयोग करता हैं, जो डिवाइस पर समर्थित नहीं हैं
unsafe-content-type = असुरक्षित कंटेंट
unsafe-content-type-error = पेज दिखाया नहीं जा सकता क्योंकि इसे खोलना सुरक्षित नहीं हैं।
