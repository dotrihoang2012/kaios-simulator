cancel = रद्द गर्नुहोस्
check-settings = सेटिङहरू जाँच्नुहोस्
close = बन्द गर्नुहोस्
connection-failed = जडान गर्न असमर्थ भयो
connection-failed-error = जब साइटमा पुग्ने प्रयासमा थियौ त्यतिबेला नेटवर्कमा त्रुटि आयो
content-encoding = पृष्ठ प्रदर्शन गर्न सकिदैन
content-encoding-error = यो पृष्ठमा यन्त्रलाई प्रदर्शन गर्न सकिदैन किनकी विषयवस्तु संकेतन त्रुटि भएको छ।
corrupted-content = जडान गर्न असमर्थ भयो
corrupted-content-error = पृष्ठको डेटा प्रसारणमा गलत भेटाइएको कारण यसलाई देखाउन सकिदैन।
denied-port-access = ठेगाना प्रतिबन्धित गरिएको
denied-port-access-error = यस ठेगानाले नेटवर्क पोर्ट प्रयोग गर्छ जसमा अरु वेब ब्राउजिङ भन्दा कार्यको लागि सामान्य तरिकाले प्रयोग हुन्छ। यस यन्त्रले तपाईंको संरक्षणको लागि गरिएको अनुरोधलाई रद्द गर्दिएको छ।
file-not-found = फाइल फेला परेन
file-not-found-error = यो पृष्ठमा यन्त्रलाई प्रदर्शन गर्न सकिदैन किनकी फाइल फेला परेको छैन।
invalid-connection = जडान गर्न असमर्थ भयो
invalid-connection-error = जब साइटमा पुग्ने प्रयासमा थियौ त्यतिबेला नेटवर्कमा त्रुटि आयो
is-printing = पहुँच अस्वीकार गरियो
is-printing-error = कागजात प्रिन्ट गर्दा वा प्रिन्ट पूर्वावलोकन गर्दा परिवर्तन हुँदैन।
malformed-uri = URL मान्य छैन
malformed-uri-error = URL प्रविष्ट गर्नुभएको मान्य छैन र लोड गरिएको हुन सक्दैन।
malware-blocked = मेलवयेर आक्रमण ब्लक गरियो
malware-blocked-error = त्यो क्षेत्रहरूलाई आक्रमण क्षेत्र सुचित गरिएको छ। त्यो यन्त्रले तपाईंको संरक्षणको लागि गरिएको अनुरोधलाई ब्लक गर्दिएको छ।
network-error-in-app = अहिलेसम्म इन्टरनेट पहुँच भएको छैन्।
network-error-launching = {{name}} लाई इन्टरनेट आवश्यक छ।
network-error-launching-message = तपाईंसँग इन्टरनेट जडान छैन। अहिले इन्टरनेटमा जडान गर्नुहुन्छ।
network-error-launching-title = इन्टरनेट जडान छैन
not-cached = पृष्ठ समाप्त भयो
not-cached-error = सुरक्षा सावधानी अनुसार, यन्त्रले गर्दा यो पृष्ठमा प्रदर्शित हुन सकेन किनभने यसको म्याद समाप्त भयो।
phishing-blocked = चेतावनी
phishing-blocked-error = वेब क्षेत्रलाई वेब बनावट बनाइएको छलकप्टी प्रयोगकर्ताहरुको लागि देखी व्यक्तिगत जानकारी वा वित्तीय जानकारीको मा सुचित गरिएको छ।
proxy-connect-failure = प्रोक्सी सर्भर त्रुटि
proxy-connect-failure-error = कन्फिगर गरिएको प्रोक्सी सर्भर प्रयोग गर्न यन्त्र जडानहरू अस्वीकार गर्नुहोस्।
proxy-resolve-failure = प्रोक्सी सर्भर त्रुटि
proxy-resolve-failure-error = कन्फिगर गरिएको प्रोक्सी सर्भर प्रयोग गर्न यन्त्र पत्ता लागेन।
quit = छोड्नुहोस्
redirect-loop = पृष्ठ प्रदर्शन गर्न सकिदैन
redirect-loop-error = यो पृष्ठमा यन्त्रलाई प्रदर्शन गर्न सकिदैन किनकी यस पृष्ठलाई उचित ढङ्गले पुन: निर्दिष्ट भएको छैन। यो पृष्ठलाई पछिको समयमा पुन: प्रयास गर्नुहोस्।
refresh = पुनःताजा गर्नुहोस्
remote-xul = पृष्ठ सहयोगरहित
remote-xul-error = यस पृष्ठले यस यन्त्रमा समर्थन नगर्ने प्रविधिको प्रयोग गरेको हुनाले यसलाई प्रदर्शित गर्न सकिदैन्।
server-not-found = सर्भर फेला परेन
server-not-found-error = {{name}} मा सर्भर पत्ता लगाउन सकिएन।
settings = सेटिङ्हरू
tap-to-check-settings = जाँच सेटिङहरूमा ट्याप गर्नुहोस्
try-again = फेरि प्रयास गर्नुहोस्
unable-to-connect = जडान गर्न असमर्थ भयो
unknown-error = एउटा अज्ञात त्रुटि भयो।
unknown-protocol-found = पृष्ठ सहयोगरहित
unknown-protocol-found-error = पृष्ठ डिस्प्ले भएको छैन किनभने यसले यन्त्रमा प्रविधिको प्रयोगहरू गर्न समर्थित छैन।
unsafe-content-type = असुरक्षित सामग्री
unsafe-content-type-error = पृष्ठ खोल्दा सुरक्षित नहुने कारण यसलाई देखाउन सकिदैन्।
