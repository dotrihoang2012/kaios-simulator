about-kaios-account-text1 = KaiOS அக்கவுண்டானது, KaiOS சேவைகளுக்கான அங்கீகரிப்பை வழங்குகிறது.  அக்கவுண்டானது யூசர் மற்றும் சாதனத்தை அடையாளம் கண்டு, சாதனங்களின் தொலை மேலாண்மை மற்றும் கூடுதல் சேவைகள் போன்ற ஃபீச்சர்களை அக்சஸ் செய்ய அனுமதிக்கிறது
about-kaios-account-text2 = அக்கவுண்ட்-ஐ உருவாக்குவதற்கு இமெயில் அட்ரஸ் மற்றும் பாஸ்வெர்ட் தேவை.  அக்கவுண்ட் உருவாக்கத்தின் போது அனுப்பப்பட்ட இமெயில் லிங்க் வழியாக யூசர் இமெயில் அட்ரஸ்-ஐ சரிபார்க்க வேண்டும்.  இந்த  இமெயில் அட்ரஸ் சரிபார்க்கப்படும் வரை அக்கவுண்ட் செயல்படுத்தப்படாது.
